apiVersion: v1
kind: Service
metadata:
  name: {{ include "runboat.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "runboat.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "runboat.selectorLabels" . | nindent 4 }}
